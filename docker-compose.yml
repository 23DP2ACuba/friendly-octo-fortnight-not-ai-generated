services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: uniplaner-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: uniplaner
      MYSQL_USER: uniplaner_user
      MYSQL_PASSWORD: uniplaner_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uniplaner-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Laravel serves Inertia responses and the frontend asset manifest.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: uniplaner-backend
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: UniPlaner
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: uniplaner
      DB_USERNAME: uniplaner_user
      DB_PASSWORD: uniplaner_password
    volumes:
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - uniplaner-network
    command: >
      sh -c "rm -f bootstrap/cache/packages.php bootstrap/cache/services.php &&
             (grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force) &&
             php artisan storage:link --force &&
             php artisan migrate --force &&
             /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: uniplaner-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uniplaner-network

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local
  backend_cache:
    driver: local

networks:
  uniplaner-network:
    driver: bridge
