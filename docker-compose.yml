version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: uniplaner-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: uniplaner
      MYSQL_USER: uniplaner_user
      MYSQL_PASSWORD: uniplaner_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - uniplaner-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      timeout: 20s
      retries: 10
      interval: 10s

  # Laravel Backend with Inertia.js + Vue (Full Stack)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniplaner-backend
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: UniPlaner
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: uniplaner
      DB_USERNAME: uniplaner_user
      DB_PASSWORD: uniplaner_password
    volumes:
      - ./backend:/var/www/html
      - backend_storage:/var/www/html/storage
      - backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - uniplaner-network
    command: >
      sh -c "php artisan key:generate --force &&
             php artisan storage:link &&
             php artisan migrate --force &&
             /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"

volumes:
  mysql_data:
    driver: local
  backend_storage:
    driver: local
  backend_cache:
    driver: local

networks:
  uniplaner-network:
    driver: bridge